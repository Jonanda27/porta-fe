<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="Lambang Daerah Kabupaten Mimika">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="65%" stop-color="#CBEBFA" />
      <stop offset="100%" stop-color="#E6F6FE" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M 22,18 L 178,18 C 182,18 184,21 184,25 L 184,122 C 184,168 145,196 100,208 C 55,196 16,168 16,122 L 16,25 C 16,21 18,18 22,18 Z" />
    </clipPath>
  </defs>

  <!-- Outer Shield Border -->
  <path
    d="M 18,14 L 182,14 C 187,14 190,17 190,22 L 190,123 C 190,172 148,202 100,214 C 52,202 10,172 10,123 L 10,22 C 10,17 13,14 18,14 Z"
    fill="url(#goldGrad)"
    stroke="#1E293B"
    stroke-width="2.5"
  />

  <!-- Inner Shield Background -->
  <g clip-path="url(#shieldClip)">
    <!-- Sky -->
    <rect x="14" y="16" width="172" height="196" fill="url(#skyGrad)" />

    <!-- Top Banner -->
    <rect x="14" y="16" width="172" height="24" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5" />
    <text
      x="100"
      y="32"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11.5"
      font-weight="800"
      letter-spacing="0.6"
      fill="#0F172A"
    >KABUPATEN MIMIKA</text>

    <!-- Distant Snow-Capped Mountains (Cartenz / Jayawijaya) -->
    <polygon points="16,118 58,72 95,118" fill="#15803D" />
    <polygon points="62,118 100,64 138,118" fill="#166534" />
    <polygon points="105,118 145,74 186,118" fill="#15803D" />
    <!-- Snow peaks -->
    <polygon points="90,78 100,64 110,78 104,76 100,81 96,76" fill="#FFFFFF" />
    <polygon points="50,81 58,72 66,81 61,79 58,83 55,79" fill="#F1F5F9" />
    <polygon points="137,83 145,74 153,83 148,81 145,84 142,81" fill="#F1F5F9" />

    <!-- Golden 5-Pointed Star -->
    <polygon
      points="100,43 103.5,51.5 112.5,52 105.5,57.8 107.8,66.5 100,61.5 92.2,66.5 94.5,57.8 87.5,52 96.5,51.5"
      fill="url(#goldGrad)"
      stroke="#78350F"
      stroke-width="1"
    />

    <!-- Water / Coastal Waves -->
    <rect x="14" y="118" width="172" height="92" fill="url(#waterGrad)" />
    <path d="M 14,126 Q 35,120 56,126 T 98,126 T 140,126 T 186,126" fill="none" stroke="#BAE6FD" stroke-width="2" />
    <path d="M 14,138 Q 35,132 56,138 T 98,138 T 140,138 T 186,138" fill="none" stroke="#7DD3FC" stroke-width="1.6" />

    <!-- Traditional Papuan Canoe (Perahu) & Paddle -->
    <path
      d="M 52,126 Q 100,154 148,124 Q 140,142 100,147 Q 60,142 52,126 Z"
      fill="#292524"
      stroke="#F59E0B"
      stroke-width="1.5"
    />
    <!-- Canoe Prow Ornament -->
    <path d="M 52,126 C 46,116 48,108 55,105 C 53,113 55,119 60,124 Z" fill="#292524" stroke="#F59E0B" stroke-width="1.2" />
    <path d="M 148,124 C 154,114 152,106 145,103 C 147,111 145,117 140,122 Z" fill="#292524" stroke="#F59E0B" stroke-width="1.2" />

    <!-- Left Paddy (Padi) Wreath -->
    <path d="M 88,174 C 52,165 36,135 42,95" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
    <g fill="#FDE047" stroke="#854D0E" stroke-width="0.6">
      <ellipse cx="42" cy="100" rx="3.2" ry="5.5" transform="rotate(-20 42 100)" />
      <ellipse cx="40" cy="112" rx="3.2" ry="5.5" transform="rotate(-15 40 112)" />
      <ellipse cx="42" cy="124" rx="3.2" ry="5.5" transform="rotate(-5 42 124)" />
      <ellipse cx="46" cy="136" rx="3.2" ry="5.5" transform="rotate(10 46 136)" />
      <ellipse cx="53" cy="148" rx="3.2" ry="5.5" transform="rotate(25 53 148)" />
      <ellipse cx="63" cy="158" rx="3.2" ry="5.5" transform="rotate(40 63 158)" />
      <ellipse cx="75" cy="166" rx="3.2" ry="5.5" transform="rotate(55 75 166)" />
    </g>

    <!-- Right Cotton (Kapas) Wreath -->
    <path d="M 112,174 C 148,165 164,135 158,95" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" />
    <g fill="#FFFFFF" stroke="#166534" stroke-width="1">
      <circle cx="158" cy="100" r="4.8" />
      <circle cx="160" cy="113" r="4.8" />
      <circle cx="158" cy="126" r="4.8" />
      <circle cx="153" cy="139" r="4.8" />
      <circle cx="145" cy="151" r="4.8" />
      <circle cx="134" cy="161" r="4.8" />
      <circle cx="122" cy="169" r="4.8" />
    </g>

    <!-- Bottom Motto Ribbon -->
    <path
      d="M 46,176 Q 100,192 154,176 L 148,192 Q 100,206 52,192 Z"
      fill="#DC2626"
      stroke="#7F1D1D"
      stroke-width="1.2"
    />
    <text
      x="100"
      y="191"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="7.5"
      font-weight="800"
      letter-spacing="0.4"
      fill="#FEF08A"
    >EME NEME YAUWARE</text>
  </g>
</svg>
